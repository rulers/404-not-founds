name: Pull Request CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare runner-provided Chromium and video encoder
        timeout-minutes: 3
        run: |
          test -x /usr/bin/google-chrome
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          npx playwright install ffmpeg
      - run: npm run test:e2e
      - name: Verify static entrypoints
        run: |
          test -f out/index.html
          test -f out/discover/index.html
          test -f out/404/001/index.html
          test -f out/404/002/index.html
          test -f out/404/003/index.html
          test -f out/404/004/index.html
          test -f out/404/005/index.html
          test -f out/404/006/index.html
          test -f out/404/007/index.html
          test -f out/404/008/index.html
          test -f out/404/009/index.html
          test -f out/404.html
      - name: Upload browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-${{ github.event.pull_request.number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
